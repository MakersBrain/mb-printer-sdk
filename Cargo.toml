# SPDX-License-Identifier: AGPL-3.0-or-later
[workspace]
members = ["crates/mb-printer-agent", "crates/mb-printer-agent-proto", "crates/mb-printer-core", "crates/mb-printer-executor", "crates/mb-printer-native", "crates/mb-printer-wasm"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "AGPL-3.0-or-later"
authors = ["Makers' Brain contributors"]
repository = "https://github.com/MakersBrain/mb-printer-sdk"
homepage = "https://github.com/MakersBrain/mb-printer-sdk"
rust-version = "1.98"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
sha2 = "0.10"
tracing = "0.1"
async-snmp = { version = "=0.18.1", default-features = false }

[workspace.lints.rust]
future-incompatible = "warn"
nonstandard-style = "deny"
unsafe-op-in-unsafe-fn = "deny"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
perf = { level = "warn", priority = -1 }

[workspace.lints.rustdoc]
broken_intra_doc_links = "deny"
