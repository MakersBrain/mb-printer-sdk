# SPDX-License-Identifier: AGPL-3.0-or-later
[workspace]
members = ["crates/mb-printer-core", "crates/mb-printer-native", "crates/mb-printer-wasm"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "AGPL-3.0-or-later"
authors = ["Makers' Brain contributors"]
repository = "https://github.com/MakersBrain/mb-printer-sdk"
homepage = "https://github.com/MakersBrain/mb-printer-sdk"
rust-version = "1.92"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
sha2 = "0.10"
tracing = "0.1"
