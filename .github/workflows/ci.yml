name: CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  rust-and-packages:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          targets: wasm32-unknown-unknown
          components: rustfmt, clippy
      - run: cargo fmt --all --check
      - run: python3 scripts/generate_schema_projection.py --check
      - run: cargo test --workspace --locked
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo build -p mb-printer-wasm --target wasm32-unknown-unknown --release --locked
      - run: cargo package --workspace --locked
      - name: Test unpacked core crate archive
        run: cd target/package/mb-printer-core-$(cat VERSION) && cargo test --locked
      - run: diff -qr schema crates/mb-printer-core/schema && diff -qr fixtures/v4 crates/mb-printer-core/fixtures/v4 && diff -qr fixtures/v3 crates/mb-printer-core/fixtures/v3 && diff -qr fixtures/template crates/mb-printer-core/fixtures/template && cmp fixtures/protocol/python-actions.json crates/mb-printer-core/fixtures/protocol/python-actions.json && cmp fixtures/protocol/matrix.json crates/mb-printer-core/fixtures/protocol/matrix.json && cmp fixtures/wasm/equivalence.json crates/mb-printer-core/fixtures/wasm/equivalence.json
      - run: python3 scripts/generate_dependency_inventory.py && git diff --exit-code -- THIRD_PARTY_LICENSES.md
      - run: sh scripts/check_release_version.sh
  npm-wasm-runtime:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          targets: wasm32-unknown-unknown
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: crates/mb-printer-wasm/package-lock.json
      - id: chrome
        uses: browser-actions/setup-chrome@48483d551c22a1fe6154c6a195ccc6d5773dc8c4 # v2
      - run: npm ci
        working-directory: crates/mb-printer-wasm
      - run: npm run build
        working-directory: crates/mb-printer-wasm
      - run: npm run test:schema && npm run test:wasm-node
        working-directory: crates/mb-printer-wasm
      - run: npm run test:wasm-browser
        working-directory: crates/mb-printer-wasm
        env:
          CHROMIUM_BIN: ${{ steps.chrome.outputs.chrome-path }}
      - run: npm audit --omit=dev && npm pack --dry-run
        working-directory: crates/mb-printer-wasm
