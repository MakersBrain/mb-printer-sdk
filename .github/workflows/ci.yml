# SPDX-License-Identifier: AGPL-3.0-or-later
name: CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  rust-and-packages:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: 1.92.0
          targets: wasm32-unknown-unknown
          components: rustfmt, clippy
      - run: cargo fmt --all --check
      - run: python3 scripts/generate_schema_projection.py --check
      - run: cargo test --workspace --all-features --locked
      - run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings
      - run: cargo check -p mb-printer-native --no-default-features --locked
      - run: cargo build -p mb-printer-wasm --target wasm32-unknown-unknown --release --locked
      - name: Build publishable crate archives in registry order
        run: |
          cargo package -p mb-printer-core --locked
          cargo package --workspace --locked --no-verify
      - name: Test unpacked core crate archive
        run: cd target/package/mb-printer-core-$(cat VERSION) && cargo test --locked
      - run: diff -qr schema crates/mb-printer-core/schema && diff -qr fixtures/v4 crates/mb-printer-core/fixtures/v4 && diff -qr fixtures/v3 crates/mb-printer-core/fixtures/v3 && diff -qr fixtures/template crates/mb-printer-core/fixtures/template && diff -qr fixtures/protocol crates/mb-printer-core/fixtures/protocol && diff -qr fixtures/wasm crates/mb-printer-core/fixtures/wasm
      - run: python3 scripts/generate_dependency_inventory.py && git diff --exit-code -- THIRD_PARTY_LICENSES.md
      - run: sh scripts/check_release_version.sh
  npm-wasm-runtime:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: 1.92.0
          targets: wasm32-unknown-unknown
          components: rustfmt
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: crates/mb-printer-wasm/package-lock.json
      - name: Locate hosted-runner Chrome
        id: chrome
        shell: bash
        run: |
          chrome_path="$(command -v google-chrome-stable || command -v google-chrome || command -v chromium)"
          test -x "$chrome_path"
          "$chrome_path" --version
          echo "chrome-path=$chrome_path" >> "$GITHUB_OUTPUT"
      - run: npm ci
        working-directory: crates/mb-printer-wasm
      - run: npm run build
        working-directory: crates/mb-printer-wasm
      - run: npm run test:schema && npm run test:wasm-node
        working-directory: crates/mb-printer-wasm
      - run: npm run test:wasm-browser
        working-directory: crates/mb-printer-wasm
        env:
          CHROMIUM_BIN: ${{ steps.chrome.outputs.chrome-path }}
      - run: npm audit --omit=dev && npm pack --dry-run
        working-directory: crates/mb-printer-wasm
  native-optional-features:
    strategy:
      matrix:
        include:
          - {os: macos-latest, features: 'serial,usb,ble,wifi,native-input'}
          - {os: windows-latest, features: 'serial,usb,ble,wifi,native-input'}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: 1.92.0
      - run: cargo check -p mb-printer-native --features "${{ matrix.features }}" --locked
