# SPDX-License-Identifier: AGPL-3.0-or-later
name: Release
on:
  push:
    tags: ['v*']
permissions:
  contents: write
  id-token: write
  attestations: write
jobs:
  version:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      - run: sh scripts/check_release_version.sh
  native-targets:
    needs: version
    strategy:
      matrix:
        include:
          - {os: ubuntu-latest, target: x86_64-unknown-linux-gnu}
          - {os: macos-latest, target: aarch64-apple-darwin}
          - {os: windows-latest, target: x86_64-pc-windows-msvc}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          targets: ${{ matrix.target }}
      - run: cargo check -p mb-printer-core -p mb-printer-native --target ${{ matrix.target }} --locked
      - if: matrix.os == 'ubuntu-latest'
        run: cargo check -p mb-printer-native --all-features --target ${{ matrix.target }} --locked
  package:
    needs: [version, native-targets]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          targets: wasm32-unknown-unknown
          components: rustfmt, clippy
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: crates/mb-printer-wasm/package-lock.json
          registry-url: https://registry.npmjs.org
      - id: chrome
        uses: browser-actions/setup-chrome@48483d551c22a1fe6154c6a195ccc6d5773dc8c4 # v2
      - run: cargo fmt --all --check && cargo test --workspace --all-features --locked && cargo clippy --workspace --all-targets --all-features --locked -- -D warnings
      - name: Build publishable crate archives in registry order
        run: |
          cargo package -p mb-printer-core --locked
          cargo package --workspace --locked --no-verify
      - run: cd target/package/mb-printer-core-$(cat VERSION) && cargo test --locked
      - run: npm ci && npm run build && npm run test:schema && npm run test:wasm-node
        working-directory: crates/mb-printer-wasm
      - run: npm run test:wasm-browser
        working-directory: crates/mb-printer-wasm
        env:
          CHROMIUM_BIN: ${{ steps.chrome.outputs.chrome-path }}
      - run: npm audit --omit=dev && npm pack
        working-directory: crates/mb-printer-wasm
      - run: python3 scripts/generate_dependency_inventory.py && git diff --exit-code -- THIRD_PARTY_LICENSES.md
      - uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0
        with:
          path: .
          format: spdx-json
          output-file: mb-printer-sdk.spdx.json
          upload-artifact: false
      - name: Collect release artifacts and checksums
        run: |
          mkdir release-artifacts
          cp target/package/*.crate release-artifacts/
          cp crates/mb-printer-wasm/makersbrain-printer-sdk-*.tgz release-artifacts/
          cp LICENSE CHANGELOG.md VERSIONING.md NOTICE.md THIRD_PARTY_LICENSES.md mb-printer-sdk.spdx.json release-artifacts/
          cd release-artifacts
          sha256sum * > SHA256SUMS
      - uses: actions/attest-build-provenance@96b4a1ef7235a096b17240c259729fdd70c83d45 # v2
        with:
          subject-path: release-artifacts/*
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-artifacts
          path: release-artifacts/
          if-no-files-found: error
      - uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          files: release-artifacts/*
          generate_release_notes: true
  publish:
    needs: package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: release-artifacts
          path: release-artifacts
      - name: Publish Cargo crates in dependency order
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          cargo publish -p mb-printer-core --locked
          for attempt in 1 2 3 4 5 6; do
            cargo search mb-printer-core --limit 1 | grep -q "$(cat VERSION)" && break
            sleep 10
          done
          cargo publish -p mb-printer-native --locked
          cargo publish -p mb-printer-wasm --locked
      - name: Publish npm package with provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: npm publish release-artifacts/makersbrain-printer-sdk-$(cat VERSION).tgz --access public --provenance
