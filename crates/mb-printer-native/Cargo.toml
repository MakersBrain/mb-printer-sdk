# SPDX-License-Identifier: AGPL-3.0-or-later
[package]
name = "mb-printer-native"
description = "Native execution boundary for mb-printer action plans"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
rust-version.workspace = true
documentation = "https://docs.rs/mb-printer-native"
readme = "README.md"
keywords = ["thermal-printer", "label", "transport"]
categories = ["hardware-support"]
include = ["/src/**", "/tests/**", "/Cargo.toml", "/README.md", "/LICENSE"]
[features]
default = []
bluetooth-rfcomm = ["dep:libc"]
serial = ["dep:serialport"]
usb = ["dep:rusb"]
ble = ["dep:btleplug", "dep:futures-util", "dep:tokio", "dep:uuid"]
ble-vendored-dbus = ["ble", "dep:dbus"]
wifi = []
dns-sd = ["wifi", "dep:mdns-sd"]
native-input = []
[dependencies]
mb-printer-core = { version = "=0.1.0", path = "../mb-printer-core" }
thiserror.workspace = true
sha2.workspace = true
tracing.workspace = true
serialport = { version = "4.8", default-features = false, optional = true }
rusb = { version = "0.9", features = ["vendored"], optional = true }
btleplug = { version = "0.11", optional = true }
dbus = { version = "0.9", features = ["vendored"], optional = true }
futures-util = { version = "0.3", optional = true }
tokio = { version = "1", features = ["rt-multi-thread", "time", "sync"], optional = true }
uuid = { version = "1", optional = true }
libc = { version = "0.2", optional = true }
mdns-sd = { version = "0.21", optional = true }
[dev-dependencies]
serde.workspace = true
serde_json.workspace = true
